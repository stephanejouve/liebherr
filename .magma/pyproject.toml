[tool.poetry]
name = "liebherr-magma-devlayer"
version = "0.0.0"
description = "Dev-only overlay for magma quality standards on bhuebschen/liebherr fork. Not shipped to upstream, not part of the HACS integration itself."
authors = ["magma-admin-bot <noreply@anthropic.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
pytest-mock = "^3.14"
black = "^24.10"
ruff = "^0.8"
isort = "^7.0"
pre-commit = "^4.0"

# HA test helper deps (only needed to import HA base classes in tests)
homeassistant = "^2025.1"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Alignés sur magma. Ajustables si l'upstream a des règles conflictuelles.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
